# PostgreSQL and the realtime collector.

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ets
      POSTGRES_USER: ets
      POSTGRES_PASSWORD: ets
      TZ: America/Edmonton
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ets -d ets"]
      interval: 5s
      timeout: 3s
      retries: 20

  collector:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ets:ets@db:5432/ets
      ARCHIVE_DIR: /app/archive
    volumes:
      - ./archive:/app/archive

volumes:
  pgdata:
